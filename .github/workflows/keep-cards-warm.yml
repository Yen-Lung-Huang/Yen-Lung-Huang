# Keeps the README card endpoints and GitHub's camo proxy cache warm so the
# cards render instantly instead of timing out (camo aborts fetches after ~4s,
# which is what made cards break into alt text).
#
# This workflow only sends GET requests — it never commits anything.
name: Keep README cards warm

on:
  schedule:
    # every 5 min to match the cards' 300s cache TTL, so this job (not a real
    # visitor) is the one that triggers the slow camo re-fetch after expiry
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm card origin endpoints (Vercel edge cache)
        run: |
          urls=(
            'https://github-readme-stats-yen-lung-huang.vercel.app/api?username=Yen-Lung-Huang&show_icons=true&theme=radical&title_color=39FF14&ring_color=FF2D55&include_all_commits=true&count_private=true&rank_icon=github&cache_seconds=900'
            'https://github-readme-stats-yen-lung-huang.vercel.app/api/top-langs/?username=Yen-Lung-Huang&layout=compact&theme=ambient_gradient&bg_color=20,0D1B2A,1B263B,415A77&langs_count=8&cache_seconds=900'
            'https://github-readme-streak-stats-yen-lung.vercel.app?user=Yen-Lung-Huang&theme=dark&ring=FFB000&fire=FF2D55&currStreakLabel=FFB000&card_width=478&card_height=186'
            'https://github-profile-summary-cards-yen-lu.vercel.app/api/cards/productive-time?username=Yen-Lung-Huang&theme=dark&utcOffset=8'
          )
          for url in "${urls[@]}"; do
            code=$(curl -sS -o /dev/null -w '%{http_code} (%{time_total}s)' --max-time 30 --retry 2 "$url" || echo 'FAILED')
            echo "$code  $url"
          done

      - name: Warm camo proxy cache (what the profile page actually loads)
        run: |
          html=$(curl -sS --max-time 30 --retry 2 'https://github.com/Yen-Lung-Huang')
          echo "$html" | grep -oE 'https://camo\.githubusercontent\.com/[a-f0-9/]+' | sort -u | while read -r url; do
            code=$(curl -sS -o /dev/null -w '%{http_code} (%{time_total}s)' --max-time 30 "$url" || echo 'FAILED')
            echo "$code  $url"
          done
