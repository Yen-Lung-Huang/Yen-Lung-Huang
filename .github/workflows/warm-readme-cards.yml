name: Refresh README cards

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  push:
    paths:
      - ".github/workflows/warm-readme-cards.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-card-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh card SVG cache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets/readme-cards

          cards=(
            "assets/readme-cards/github-stats.svg|https://github-readme-stats-yen-lung-huang.vercel.app/api?username=Yen-Lung-Huang&show_icons=true&theme=radical&title_color=39FF14&ring_color=FF2D55&include_all_commits=true&count_private=true&rank_icon=github&cache_seconds=900"
            "assets/readme-cards/top-languages.svg|https://github-readme-stats-yen-lung-huang.vercel.app/api/top-langs/?username=Yen-Lung-Huang&layout=compact&theme=ambient_gradient&bg_color=20,0D1B2A,1B263B,415A77&langs_count=8&cache_seconds=900"
            "assets/readme-cards/streak.svg|https://github-readme-streak-stats-yen-lung.vercel.app?user=Yen-Lung-Huang&theme=dark&ring=FFB000&fire=FF2D55&currStreakLabel=FFB000&card_width=478&card_height=186&cache_bust=${GITHUB_RUN_ID}"
            "assets/readme-cards/productive-time.svg|https://github-profile-summary-cards-yen-lu.vercel.app/api/cards/productive-time?username=Yen-Lung-Huang&theme=dark&utcOffset=8"
          )

          refreshed=0
          for card in "${cards[@]}"; do
            file="${card%%|*}"
            url="${card#*|}"
            tmp_file="$(mktemp)"
            echo "::group::$url"
            if ! curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 15 \
              --max-time 60 \
              --output "$tmp_file" \
              --write-out "status=%{http_code} content_type=%{content_type} time=%{time_total}s size=%{size_download}\n" \
              "$url"; then
              echo "::warning::Keeping previous card because download failed: $file"
              rm -f "$tmp_file"
              echo "::endgroup::"
              continue
            fi
            if ! grep -q "<svg" "$tmp_file"; then
              echo "::warning::Keeping previous card because response was not SVG: $file"
              rm -f "$tmp_file"
              echo "::endgroup::"
              continue
            fi
            if grep -Eiq "ERROR|Bad credentials|No more GITHUB_TOKEN|API rate limit" "$tmp_file"; then
              echo "::warning::Keeping previous card because endpoint returned an error card: $file"
              rm -f "$tmp_file"
              echo "::endgroup::"
              continue
            fi
            mv "$tmp_file" "$file"
            refreshed=$((refreshed + 1))
            echo "::endgroup::"
          done
          if [ "$refreshed" -eq 0 ]; then
            echo "No cards refreshed successfully." >&2
            exit 1
          fi

          streak_hash="$(sha256sum assets/readme-cards/streak.svg | cut -c1-12)"
          streak_file="assets/readme-cards/streak-${streak_hash}.svg"
          cp assets/readme-cards/streak.svg "$streak_file"
          find assets/readme-cards -maxdepth 1 -type f -name 'streak-*.svg' ! -name "streak-${streak_hash}.svg" -delete
          perl -0pi -e "s#src=\"assets/readme-cards/streak-[^\"]+\\.svg\"#src=\"${streak_file}\"#g" README.md

      - name: Commit refreshed SVG cache
        shell: bash
        run: |
          set -euo pipefail

          git add README.md assets/readme-cards
          if git diff --cached --quiet; then
            echo "No card changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh README card cache [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
